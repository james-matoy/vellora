<style>
    /* 1. FONT IMPORT */
    @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap');

    /* Global Overwrite */
    html,
    body {
        margin-top: 0 !important;
        padding-top: 0 !important;
        margin: 0;
    }

    .value-proposition-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px !important;
        background-color: #ffffff;
    }

    .systems-identity-card {
        position: relative;
        width: 100%;
        max-width: 600px;
        padding: 60px;
        /* Updated to match the first card's measurement */
        border-radius: 28px;

        background: #ffffff;
        border: 1px solid transparent;
        box-shadow: none;

        display: flex;
        flex-direction: column;
        gap: 30px;
        overflow: hidden;
        cursor: pointer;
        z-index: 1;
        transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        box-sizing: border-box;
        font-family: 'Nunito Sans', sans-serif;
    }

    /* Hover state */
    .systems-identity-card:hover {
        background: #ffffff;
        border-color: #e0e0e0;
        box-shadow: 0 10px 30px #310F5C26;
    }

    /* 1. INTERNAL SPOTLIGHT */
    .systems-identity-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(600px circle at var(--mouse-x, -100%) var(--mouse-y, -100%),
                rgba(91, 44, 152, 0.12),
                transparent 50%);
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
    }

    /* 2. EDGE GLOW (Mouse tracking) */
    .systems-identity-card::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 28px;
        padding: 1.8px;
        z-index: 2;
        background: radial-gradient(250px circle at var(--mouse-x, -100%) var(--mouse-y, -100%),
                #5B2C98 0%,
                rgba(91, 44, 152, 0.8) 15%,
                rgba(91, 44, 152, 0.2) 40%,
                transparent 60%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
    }

    .systems-identity-card:hover::before,
    .systems-identity-card:hover::after {
        opacity: 1;
    }

    /* Text Styles */
    .differentiation-statement {
        font-size: 55px;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: #5b2c98;
        line-height: 1.1;
        position: relative;
        z-index: 3;
        margin: 0;
    }

    .system-definition {
        font-size: 30px;
        font-weight: 700;
        color: #4b5563;
        line-height: 1.3;
        position: relative;
        z-index: 3;
        margin: 0;
    }

    @media (max-width: 480px) {
        .value-proposition-wrapper {
            padding: 40px 20px !important;
        }

        .systems-identity-card {
            width: 100%;
            padding: 30px;
        }

        .differentiation-statement {
            font-size: 40px;
        }

        .system-definition {
            font-size: 22px;
        }
    }
</style>

<div class="value-proposition-wrapper">
    <div class="systems-identity-card">
        <div class="differentiation-statement">We are NOT an automation shop.</div>
        <div class="system-definition">We are an AI Systems Company with repeatable delivery, predictable growth, and a
            scalable product systems.</div>
    </div>
</div>

<script>
    window.addEventListener('mousemove', (e) => {
        const identityCards = document.querySelectorAll('.systems-identity-card');
        identityCards.forEach(card => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty("--mouse-x", `${x}px`);
            card.style.setProperty("--mouse-y", `${y}px`);
        });
    });
</script>
