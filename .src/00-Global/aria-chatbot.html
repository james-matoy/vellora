<div id="ag-chat-root">
  <button class="chat-toggle" id="chatToggle" aria-label="Toggle chat">
    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <span class="notification-badge" id="notificationBadge">1</span>
  </button>

  <div class="chat-widget" id="chatWidget">
    <div class="chat-header">
      <div class="chat-header-content">
        <div class="chat-avatar">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8"/>
            <rect width="16" height="12" x="4" y="8" rx="2"/>
            <path d="M2 14h2"/>
            <path d="M20 14h2"/>
            <path d="M15 13h.01"/>
            <path d="M9 13h.01"/>
          </svg>
        </div>
        <div class="chat-header-text">
          <h2>Chat with Aria</h2>
          <p>AI Support Specialist</p>
        </div>
      </div>
      <button class="close-button" id="closeButton">
        <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="message-content">Hello! How can AgentGenius assist you today?</div>
      </div>
    </div>
    
    <div class="chat-input-container">
      <div class="input-wrapper">
        <input 
          type="text" 
          class="chat-input" 
          id="chatInput" 
          placeholder="Write a message..."
          autocomplete="off"
        >
      </div>
      <button class="send-button" id="sendButton">
        <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    
    <div class="footer-brand">
      Powered by <a href="https://n8n.io" target="_blank" rel="noopener noreferrer">n8n</a>
    </div>
  </div>
</div>

<script>
  const webhookUrl = 'https://teamagentgenius.app.n8n.cloud/webhook/58460c16-d450-405c-960c-122bc9fb8825/chat ';
  const chatWidget = document.getElementById('chatWidget');
  const chatToggle = document.getElementById('chatToggle');
  const closeButton = document.getElementById('closeButton');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendButton = document.getElementById('sendButton');
  const notificationBadge = document.getElementById('notificationBadge');
  
  let isOpen = false;
  let sessionId = 'session_' + Date.now();

  function toggleChat() {
    isOpen = !isOpen;
    chatWidget.classList.toggle('active');
    if (isOpen) {
      chatInput.focus();
      notificationBadge.classList.remove('show');
    }
  }

  chatToggle.addEventListener('click', toggleChat);
  closeButton.addEventListener('click', toggleChat);

  function addMessage(content, isUser = false) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
    messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function sendMessage() {
    const message = chatInput.value.trim();
    if (!message) return;
    
    addMessage(message, true);
    chatInput.value = '';
    sendButton.disabled = true;

    try {
      const response = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'sendMessage', sessionId: sessionId, chatInput: message })
      });
      
      if (response.ok) {
        const data = await response.json();
        addMessage(data.output || data.message || 'Thank you for your message.');
      }
    } catch (error) {
      addMessage('Something went wrong. Please try again later.');
    } finally {
      sendButton.disabled = false;
      chatInput.focus();
    }
  }

  sendButton.addEventListener('click', sendMessage);
  chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  setTimeout(() => { notificationBadge.classList.add('show'); }, 3000);
</script>
