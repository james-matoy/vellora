<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
      }
      .dsa-wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px 100px 20px; /* 100px bottom space */
      }
      .dsa-wrapper .footer {
        margin-top: 50px !important;
        border-top: 1px solid #E5E7EB;
        padding-top: 40px !important;
        text-align: center;
      }

      .dsa-wrapper .footer-nav {
        margin-bottom: 20px !important;
      }

      .dsa-wrapper .footer-nav a {
        font-family: 'Nunito Sans', sans-serif !important;
        font-weight: 400 !important; /* Forces normal weight, no bold */
        font-style: normal !important;
        font-size: 14px !important;
        color: #9CA3AF !important;  
        text-decoration: none !important; /* Suppress underline in normal state */
        margin: 0 10px;
        transition: color 0.2s ease;
      }

      .dsa-wrapper .footer-nav a:hover {
        color: #5B2C98 !important;
        text-decoration: none !important; /* Suppress underline in hover state */
      }

      .dsa-wrapper .copyright {
        font-family: 'Nunito Sans', sans-serif !important;
        font-weight: 400 !important;
        font-size: 14px !important;
        color: #9CA3AF !important;
        margin-bottom: 0 !important;
        line-height: 1 !important;
      }
    </style>
</head>
<body>

<div class="dsa-wrapper">
    <div class="footer">
        <div class="footer-nav">
            <a href="https://agentgenius.ai/privacy-policy/">Privacy Policy</a>
            <a href="https://agentgenius.ai/terms-of-service/">Terms of Service</a>
            <a href="https://agentgenius.ai/mediakit/">Media Kit</a>
        </div>
        <p class="copyright">&copy; 2026 AgentGenius.ai. All rights reserved. &middot; Burlington, ON, Canada</p>
    </div>
</div>

</body>
</html>
