<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headquarters Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #map {
            height: 175px;
            width: 100%;
            border-radius: 8px;
            border: 0.5px solid lightgrey;
            transition: height 0.3s ease;
        }
        
        /* Task: Map is grey by default */
        .leaflet-tile-pane {
            filter: grayscale(100%);
            transition: filter 0.4s ease;
        }

        /* Task: Hover returns map to original color */
        #map:hover .leaflet-tile-pane {
            filter: grayscale(0%);
        }

        /* Style for the Zoom and Reset controls */
        .leaflet-bar a, .leaflet-control-reset {
            background-color: white !important; 
            color: black !important;
            border-bottom: 1px solid lightgrey !important;
            width: 30px;
            height: 30px;
            line-height: 30px;
            display: block;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        .leaflet-control-reset {
            border-bottom: none;
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        .leaflet-bar a:hover, .leaflet-control-reset:hover {
            background-color: #f4f4f4 !important;
        }

        /* Task: In mobile view, increase the height */
        @media (max-width: 768px) {
            #map {
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const lat = 43.3248;
        const lng = -79.8063;
        const defaultZoom = 13;

        const map = L.map('map').setView([lat, lng], defaultZoom);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            detectRetina: true,
            maxZoom: 19
        }).addTo(map);

        const marker = L.marker([lat, lng]).addTo(map)
            .bindPopup("Headquarter, Burlington, ON, CA")
            .openPopup();

        const ResetControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                const button = L.DomUtil.create('a', 'leaflet-control-reset', container);
                
                button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>'; 
                
                button.title = 'Reset View';

                L.DomEvent.on(button, 'click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    map.setView([lat, lng], defaultZoom);
                    marker.openPopup();
                });

                return container;
            }
        });

        map.addControl(new ResetControl());
    </script>

</body>
</html>
